<div class="flex flex-col w-full rounded-2xl border p-6 border-muted/20 bg-white gap-6">
  <div class="flex flex-col gap-1">
    <h2 class="text-2xl font-bold">Trust & Security</h2>
    <p class="text-muted text-sm">
      Build trust with clients by verifying your contact information. Your information remains private.
    </p>
  </div>

  <hr class="border-divider">

  <div class="flex flex-col gap-4">
    <div class="flex items-start gap-3">
      <div class="mt-0.5 flex size-9 items-center justify-center rounded-full bg-emerald-50 text-emerald-600">
        <lucide-icon [img]="icons.ShieldCheck" [size]="18" aria-hidden="true"></lucide-icon>
      </div>
      <div class="flex flex-col gap-1">
        <h3 class="text-sm font-bold text-heading">Account Security</h3>
        <p class="text-xs text-muted">Keep your account safe by verifying your contact information.</p>
      </div>
    </div>

    <div class="flex flex-col gap-4 border border-divider rounded-xl p-4">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="flex size-10 items-center justify-center rounded-full bg-emerald-50 text-emerald-600">
            <lucide-icon [img]="icons.Mail" [size]="18" aria-hidden="true"></lucide-icon>
          </div>
          <div class="flex flex-col">
            <p class="text-sm font-semibold text-heading">Email</p>
            <p class="text-xs text-muted">johndoe@example.com</p>
          </div>
        </div>
        <span class="inline-flex items-center gap-1 rounded-full border border-emerald-200 bg-emerald-50 px-2.5 py-1 text-xs font-semibold text-emerald-700">
          Verified
        </span>
      </div>

      <div class="h-px bg-divider"></div>

      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="flex size-10 items-center justify-center rounded-full bg-orange-50 text-orange-600">
            <lucide-icon [img]="icons.Phone" [size]="18" aria-hidden="true"></lucide-icon>
          </div>
          <div class="flex flex-col">
            <p class="text-sm font-semibold text-heading">Phone Number</p>
            <p class="text-xs text-muted">Add a phone number for extra security</p>
          </div>
        </div>
        <button type="button"
                class="px-4 py-2 bg-primary text-white text-xs font-semibold rounded-lg hover:bg-primary/90 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
          Add Phone Number
        </button>
      </div>
    </div>
  </div>

  <hr class="border-divider">

  <div class="flex flex-row justify-between">
    <button type="button" (click)="onBack()"
            class="px-6 py-2.5 border border-divider text-heading text-sm font-medium rounded-lg hover:bg-muted/10 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
      Back
    </button>
    <button type="button" (click)="onFinish()"
            class="px-6 py-2.5 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary/90 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
      Finish
    </button>
  </div>
</div>
