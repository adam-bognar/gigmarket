<section class="bg-surface-alt py-20 md:py-28">
  <div class="mx-auto max-w-7xl px-5 md:px-8">
    <div class="mb-16 max-w-2xl">
      <p class="mb-3 text-xs font-bold uppercase tracking-widest text-primary">Why GigMarket</p>
      <h2 class="m-0 text-3xl font-black tracking-tight text-heading md:text-5xl">
        A whole world of talent,<br/>at your fingertips.
      </h2>
    </div>

    <div class="grid gap-8 md:grid-cols-3">
      @for (feature of features; track feature.title) {
        <div class="group flex flex-col gap-5 rounded-3xl border border-divider bg-surface p-8 transition hover:border-primary/30 hover:shadow-xl">
          <div class="flex size-14 items-center justify-center rounded-2xl transition group-hover:scale-110" [class]="feature.bgClass">
            <lucide-icon [img]="feature.icon" [size]="26" [class]="feature.iconClass" aria-hidden="true"/>
          </div>
          <div class="flex flex-col gap-2">
            <h3 class="m-0 text-xl font-bold text-heading">{{ feature.title }}</h3>
            <p class="m-0 text-sm leading-relaxed text-muted">{{ feature.description }}</p>
          </div>
          <div class="mt-auto pt-4">
            <span class="text-sm font-semibold text-primary opacity-0 transition group-hover:opacity-100">Learn more →</span>
          </div>
        </div>
      }
    </div>
  </div>
</section>
